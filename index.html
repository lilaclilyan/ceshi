<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志愿社团活动综合网站</title>
    <style>
        body {
            background: linear-gradient(135deg, #fff5f7 0%, #ffd9e4 100%);
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: system-ui, sans-serif;
            line-height: 1.7;
            color: #3d2b33;

            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .page {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* 大粗黑标题 */
        .main-title {
            font-size: 40px;
            font-weight: 900;
            color: #000;
            text-align: center;
            letter-spacing: 2px;
            margin: 40px 0 12px;
            line-height: 1.3;
        }

        .subtitle {
            text-align: center;
            color: #7a5a66;
            margin-bottom: 56px;
        }

        /* 两个模块左右并排 */
        .modules {
            display: flex;
            gap: 200px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .module {
            flex: 1 1 260px;
            max-width: 300px;
            text-align: center;
        }

        /* 链接放大 */
        .module h2 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 10px;
        }

        .module h2 a {
            color: #c2185b;
            text-decoration: none;
        }

        .module h2 a:hover {
            text-decoration: underline;
        }

        .module p {
            margin: 0;
            color: #5a4550;
            font-size: 15px;
        }

        /* 底部鸣谢赞助 */
        .footer {
            text-align: center;
            font-size: 13px;
            color: #8a6b76;
            padding: 32px 0 24px;
            margin-top: 64px;
            border-top: 1px solid rgba(194, 24, 91, 0.15);
        }

        .sponsor-title {
            font-size: 18px;
            font-weight: 800;
            color: #c2185b;
            margin: 0 0 8px;
        }

        .sponsor-text {
            margin: 0 0 16px;
        }

        /* 赞助方 logo */
        .sponsor-logo {
            max-width: 160px;
            height: auto;
            border-radius: 8px;
            background: #fff;
            padding: 8px;
            box-shadow: 0 4px 16px rgba(194, 24, 91, 0.12);
        }

        .sponsor-name {
            margin: 10px 0 0;
            font-size: 14px;
            font-weight: 700;
            color: #5a4550;
        }

        /* 赞助联系方式 */
        .sponsor-contact {
            margin: 16px 0 0;
            font-size: 13px;
            color: #8a6b76;
        }

        .sponsor-contact strong {
            color: #c2185b;
        }

        /* 手机屏幕适配 */
        @media (max-width: 640px) {
            .main-title {
                font-size: 28px;
                letter-spacing: 1px;
            }
            .modules {
                flex-direction: column;
                align-items: center;
                gap: 32px;
            }
            .sponsor-contact {
                line-height: 2;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="main-title">志愿社团活动综合网站</h1>
        <p class="subtitle">发布与搜索志愿、社团活动</p >

        <div class="modules">
            <!-- Post 模块 -->
            <div class="module">
                <h2><a href="post.html">Post</a ></h2>
                <p>发布志愿或社团活动，填写活动信息并展示给其他同学。</p >
            </div>

            <!-- Search 模块 -->
            <div class="module">
                <h2><a href="search.html">Search</a ></h2>
                <p>搜索志愿或社团活动，按关键词快速找到感兴趣的活动。</p >
            </div>
        </div>
    </div>

    <!-- 底部鸣谢赞助 -->
    <footer class="footer">
        <p class="sponsor-title">鸣谢赞助</p >
        <p class="sponsor-text">
            感谢以下单位/个人对本网站的支持
        </p >

        <!-- 赞助方 logo：上传 sponsor.png 到和 index.html 同一目录 -->
        <img class="sponsor-logo" src="sponsor.png" alt="赞助方 Logo">
        <p class="sponsor-name">XXX 社团 / XXX 同学</p >

        <!-- 赞助联系方式：改成你自己的，不需要的项删掉 -->
        <p class="sponsor-contact">
            赞助联系：微信 <strong>your_wechat_id</strong>　｜　邮箱 <strong>your_email@example.com</strong>
        </p >
    </footer>
</body>
</html>
