<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志愿社团活动综合网站</title>
    <style>
        body {
            background: linear-gradient(135deg, #fff5f7 0%, #ffd9e4 100%);
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: system-ui, sans-serif;
            line-height: 1.7;
            color: #3d2b33;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
        }

        /* 大粗黑标题 */
        .main-title {
            font-size: 40px;
            font-weight: 900;
            color: #000;
            text-align: center;
            letter-spacing: 2px;
            margin: 40px 0 12px;
            line-height: 1.3;
        }

        .subtitle {
            text-align: center;
            color: #7a5a66;
            margin-bottom: 48px;
        }

        /* 两个模块，上下排列，左边一条粉色竖线 */
        .module {
            border-left: 4px solid #c2185b;
            padding: 8px 0 8px 20px;
            margin-bottom: 36px;
        }

        .module h2 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px;
        }

        .module h2 a {
            color: #c2185b;
            text-decoration: none;
        }

        .module h2 a:hover {
            text-decoration: underline;
        }

        .module p {
            margin: 0;
            color: #5a4550;
            font-size: 15px;
        }

        /* 手机屏幕标题缩小 */
        @media (max-width: 640px) {
            .main-title {
                font-size: 28px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="main-title">志愿社团活动综合网站</h1>
        <p class="subtitle">发布与搜索志愿、社团活动</p >

        <!-- Post 模块 -->
        <div class="module">
            <h2><a href="post.html">Post</a ></h2>
            <p>发布志愿或社团活动，填写活动信息并展示给其他同学。</p >
        </div>

        <!-- Search 模块 -->
        <div class="module">
            <h2><a href="search.html">Search</a ></h2>
            <p>搜索志愿或社团活动，按关键词快速找到感兴趣的活动。</p >
        </div>
    </div>
</body>
</html>
