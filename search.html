<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - 志愿社团活动综合网站</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f7f6; /* 清爽的浅灰背景 */
            color: #333;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 顶部导航 */
        .top-nav {
            margin-bottom: 16px;
        }
        .top-nav a {
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .top-nav a:hover {
            color: #c2185b;
        }

        /* 1. 广告赞助位 */
        .ad-banner {
            width: 100%;
            height: 100px;
            background: #fff;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        /* 2. 搜索与分类操作区 */
        .search-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-group, .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .search-group label, .filter-group label {
            font-size: 14px;
            font-weight: 700;
            color: #4a5568;
            white-space: nowrap;
        }

        input[type="text"], select {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            color: #333;
            background: #fff;
            width: 200px;
            transition: border 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #c2185b;
        }

        /* 3. 数据表格 */
        .table-wrapper {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            overflow-x: auto; /* 手机端支持横向滑动 */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f8fafc;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            font-size: 14px;
            color: #4a5568;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        /* 鼠标悬浮行高亮 */
        tbody tr:hover {
            background-color: #fdfafb;
        }

        /* 没有搜索结果时的提示 */
        .no-data {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            display: none;
        }

        /* 手机端适配 */
        @media (max-width: 640px) {
            .search-action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-group, .filter-group {
                justify-content: space-between;
            }
            input[type="text"], select {
                width: 100%;
                max-width: 250px;
            }
            th, td {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 返回首页 -->
        <div class="top-nav">
            <a href="index.html">← 返回首页</a>
        </div>

        <!-- 1. 广告赞助位 -->
        <div class="ad-banner">
            广告赞助位
        </div>

        <!-- 2. 搜索与分类 -->
        <div class="search-action-bar">
            <div class="search-group">
                <label>关键词搜索</label>
                <input type="text" id="keywordInput" placeholder="输入活动名称或举办单位..." oninput="filterTable()">
            </div>
            
            <div class="filter-group">
                <label>分类标签</label>
                <select id="categorySelect" onchange="filterTable()">
                    <option value="全部">全部</option>
                    <option value="志愿活动">志愿活动</option>
                    <option value="社团活动">社团活动</option>
                    <option value="讲座培训">讲座培训</option>
                </select>
            </div>
        </div>

        <!-- 3. 表格 -->
        <div class="table-wrapper">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>地点</th>
                        <th>举办单位</th>
                        <th>活动名称</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 预填的模拟数据 -->
                    <tr class="data-row">
                        <td>2023-11-20 14:00</td>
                        <td>学校大礼堂</td>
                        <td>青年志愿者协会</td>
                        <td>环保公益讲座 <span style="display:none;">讲座培训</span></td>
                    </tr>
                    <tr class="data-row">
                        <td>2023-11-25 09:00</td>
                        <td>图书馆前广场</td>
                        <td>爱心社</td>
                        <td>冬季衣物捐赠 <span style="display:none;">社团活动</span></td>
                    </tr>
                    <tr class="data-row">
                        <td>2023-12-01 08:30</td>
                        <td>周边社区服务中心</td>
                        <td>红十字会</td>
                        <td>社区义诊服务 <span style="display:none;">志愿活动</span></td>
                    </tr>
                </tbody>
            </table>
            <!-- 无数据提示 -->
            <div class="no-data" id="noData">没有找到匹配的活动信息</div>
        </div>
    </div>

    <!-- 表格过滤逻辑 -->
    <script>
        function filterTable() {
            const keyword = document.getElementById('keywordInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            
            const rows = document.querySelectorAll('.data-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const rowText = row.innerText.toLowerCase(); // 获取整行文字（包含隐藏的标签）
                
                // 检查是否匹配关键词
                const matchKeyword = rowText.includes(keyword);
                // 检查分类标签是否匹配
                const matchCategory = (category === '全部') || rowText.includes(category.toLowerCase());

                if (matchKeyword && matchCategory) {
                    row.style.display = ''; // 显示
                    visibleCount++;
                } else {
                    row.style.display = 'none'; // 隐藏
                }
            });

            // 控制“无数据”提示的显示
            const noData = document.getElementById('noData');
            if (visibleCount === 0) {
                noData.style.display = 'block';
            } else {
                noData.style.display = 'none';
            }
        }
    </script>
</body>
</html>
