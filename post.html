<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布活动</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            /* 浅粉色背景 */
            background-color: #ffe6f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 1100px;
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(180, 90, 130, 0.12);
        }
        .title-box {
            text-align: center;
            margin-bottom: 40px;
        }
        .title {
            display: inline-block;
            background-color: #5488e8;
            color: white;
            font-size: 26px;
            padding: 12px 70px;
            border-radius: 12px;
            font-weight: 500;
        }
        .form-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .form-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .form-item label {
            font-size: 20px;
            color: #444;
            margin-bottom: 10px;
        }
        .form-item input {
            width: 170px;
            height: 44px;
            border: 1.5px solid #b9c8e8;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            padding: 0 10px;
            transition: 0.25s;
        }
        .form-item input:focus {
            border-color: #5488e8;
            box-shadow: 0 0 0 3px rgba(84, 136, 232, 0.18);
        }
        .btn-row {
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        button {
            background-color: #5488e8;
            color: white;
            border: none;
            font-size: 20px;
            padding: 12px 42px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.25s;
        }
        button:hover {
            background-color: #3f72d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-box">
            <div class="title">发布活动</div>
        </div>
        <div class="form-row">
            <div class="form-item">
                <label>时间</label>
                <input type="text">
            </div>
            <div class="form-item">
                <label>地点</label>
                <input type="text">
            </div>
            <div class="form-item">
                <label>举办单位</label>
                <input type="text">
            </div>
            <div class="form-item">
                <label>活动名称</label>
                <input type="text">
            </div>
            <div class="form-item">
                <label>活动具体内容</label>
                <input type="text">
            </div>
        </div>
        <div class="btn-row">
            <button>提交</button>
            <button>暂存</button>
        </div>
    </div>
</body>
</html>
